# TI BQ25895 I²C 제어 단일 셀 5 A 배터리 충전기 (전원 경로 관리 + 5 V 부스트 OTG). 값은 데이터시트에서 직접 옮김 (SLUSC88C, Rev. C, 2022-10).
# 이 문서의 절 번호는 7.x(사양), 8.x(상세 설명·레지스터)이고 쪽 번호는 PDF 쪽과 같다. 전기적 특성 표는 쪽 그림으로 최소/전형/최대 열을 확인했다.
# 레귤레이터가 아니라 상태(입력 판별, 예비충전, 정전류, 정전압, 종료, 고장)와 레지스터(감시 타이머 포함)가 있는 장치다.
part_number: BQ25895
type: charger
description: I²C 제어 단일 셀 리튬이온 5 A 스위치 모드 충전기 (입력 3.9–14 V, 입력 전류 제한 100 mA–3.25 A, 충전 최대 5.056 A, 1.5 MHz 벅, 5 V 부스트 OTG 최대 3.1 A, NVDC 전원 경로, D+/D− 어댑터 판별). WQFN-24
abs_max:                       # §7.1 p.6
  vin_v: 22                    # VBUS, PMID (변환기가 스위칭하지 않을 때). 권장 최대는 14 V
  bat_sys_v: 6                 # BAT, SYS (변환기가 스위칭하지 않을 때)
  pin_logic_v: 7               # SDA, SCL, INT, OTG, REGN, TS, CE, QON, D+, D−
  stat_dsel_btst_v: 20
  sw_v: 16
  ilim_v: 5
  int_stat_sink_ma: 6
  tj_max_c: 150
recommended:                   # §7.3 p.6
  vin_min_v: 3.9
  vin_max_v: 14                # 각주: 스위칭 잡음 스파이크가 BTST·SW 절대 최대를 넘지 않게 레이아웃을 짧게
  iin_max_a: 3.25              # VBUS 입력 전류
  isys_max_a: 5
  vbat_max_v: 4.608
  ichg_max_a: 5                # 급속 충전 전류. 배터리 방전 전류는 연속 6 A, 내부 MOSFET으로 최대 9 A(1초)
  ta_min_c: -40
  ta_max_c: 85
typical:
  vbus_uvloz_v: 3.6            # §7.5 p.7: I²C 사용 가능 최소 VBUS (배터리 없음) 3.6 V, 배터리만 있을 때 BAT 2.3 V
  vbat_uvloz_v: 2.3
  vsleep_rising_mv: 250        # VBUS가 BAT + 이 값을 넘어야 sleep 해제 (상승 130 / 250 / 370 mV, 하강 25 / 65 / 120 mV)
  acov_rising_v_min: 14.0      # §7.5 p.7: VBUS 과전압 상승 문턱 최소 14.0 / 최대 14.6 V, 하강 13.5–14.0 V. 넘으면 스위칭 즉시 정지 (CHRG_FAULT=01)
  acov_rising_v_max: 14.6
  bad_adapter_v: 3.8           # §7.5 p.7: 불량 어댑터 판별 — 30 mA를 끌어도 VBUS가 3.8 V 이상이어야 함, 30 ms, 실패하면 2초마다 재시도 (§8.2.3.2 p.15)
  bad_adapter_current_a: 0.03
  regn_enable_delay_s: 0.22    # §8.2.3.1 p.15: 입력 조건을 만족해도 REGN LDO는 220 ms 지연 뒤에 켜짐
  iinlim_default_a: 0.5        # §8.4.1 p.32: IINLIM 기본 500 mA, 범위 100 mA–3.25 A (50 mA 단계). D+/D− 판별이 끝나면 자동으로 바뀜
  iinlim_min_a: 0.1
  iinlim_max_a: 3.25
  en_ilim_default: 1           # REG00[6]: ILIM 핀 기능 기본 켜짐. 실제 입력 전류 제한은 IINLIM(또는 ICO 결과)과 ILIM 핀 중 낮은 값 (§8.2.12 p.26)
  ilim_formula: "IINMAX = KILIM / RILIM"   # §8.2.12 p.26 식 (3), KILIM 320 / 355 / 390 A·Ω (§7.5 p.9). 예: 260 Ω → 약 1.5 A. ILIM 핀을 열어 두면 한계 0 A, 접지하면 레지스터 값
  kilim_a_ohm_min: 320
  kilim_a_ohm_max: 390
  vindpm_range_v: "3.9–15.3"  # §7.5 p.8: 입력 전압 제한(VINDPM) 범위, 100 mV 단계. 입력이 이 아래로 눌리면 충전 전류를 줄임 (DPM)
  vreg_range_v: "3.840–4.608"  # §7.5 p.8: 충전 전압 범위 16 mV 단계, 기본 4.208 V (§8.2.7.1 p.21 표 8-4)
  vreg_default_v: 4.208
  ichg_range_a: "0–5.056"      # §7.5 p.8: 급속 충전 전류 범위 64 mA 단계, 기본 2.048 A
  ichg_default_a: 2.048
  iprechg_range_a: "0.064–1.024"   # 예비충전 전류 범위, 기본 128 mA
  iprechg_default_a: 0.128
  iterm_range_a: "0.064–1.024"     # 종료 전류 범위, 기본 256 mA
  iterm_default_a: 0.256
  vbat_short_v: 2.0            # §7.5 p.8: 배터리 2 V 미만(상승 시 히스테리시스 200 mV)이면 100 mA 소전류 충전
  ibat_short_a: 0.1
  vbat_lowv_falling_v: 2.8     # §7.5 p.8: 급속→예비 전환 하강 2.6 / 2.8 / 2.9 V, 예비→급속 상승 2.8 / 3.0 / 3.1 V (REG06[1]=1). 급속 충전은 이 위에서 시작
  vbat_lowv_rising_v: 3.0
  vrechg_mv: 100               # 재충전 문턱: 충전 전압보다 100 mV(VRECHG=0) 또는 200 mV(=1) 아래로 내려오면 새 충전 주기
  sys_min_default_v: 3.5       # §8.2.6.1 p.19: 최소 시스템 전압 기본 3.5 V (배터리가 방전돼도 SYS는 이 위로 조정), REG03 SYS_MIN
  batfet_rdson_ohm: 0.011      # §7.5 p.8: 11 mΩ 전형 (25 °C 최대 13 mΩ)
  batfet_ocp_a: 9              # 시스템 과전류 문턱 최소 9 A (§7.5 p.9): 배터리 방전 중 이 값을 넘으면 BATFET이 즉시 꺼짐 (BATFET_DIS 표시, §8.2.2 p.15)
  boost_voltage_range_v: "4.55–5.55"   # §7.5 p.9: 부스트(OTG) 출력 범위 64 mV 단계
  boost_current_a: 3.1         # 부스트 출력 전류 최대 3.1 A
  boost_ovp_v: 6.0             # 부스트 과전압 상승 문턱 5.8–6.0 V
  boost_exit_bat_v: 2.9        # 부스트에서 배터리가 이 아래(하강 2.6–2.9 V)로 내려가면 종료
  fsw_hz: 1.5e+6               # §7.5 p.9: 벅 스위칭 주파수 1.32–1.68 MHz, 최대 듀티 97 %
  thermal_shutdown_c: 160      # §7.5 p.9: 열 차단 160 °C, 히스테리시스 30 °C
  thermal_shutdown_hysteresis_c: 30
  thermal_regulation_c: 120    # 열 조절(TREG) 60–120 °C 중 선택. 넘으면 충전 전류를 줄이고 종료·타이머가 영향을 받음 (§8.2.13.1 p.26)
  ts_cold_threshold_pct: 73.25 # §7.5 p.9: TS 전압의 REGN 대비 비율. 충전 저온 문턱 73.25 % (상승, 72.75–73.75 %), 고온 문턱 48.25 %, 차단 44.75 %
  ts_hot_threshold_pct: 48.25
  ts_cutoff_pct: 44.75
  ts_divider_example: "103AT NTC, 0–45 °C: RT1 5.21 kΩ, RT2 29.87 kΩ"   # §8.2.7.5.1 p.23 (RTH cold 27.28 kΩ, hot 4.91 kΩ)
  watchdog_default_s: 40       # §8.4.8 p.39: I²C 감시 타이머 기본 40 s (80 s, 160 s 선택, 00이면 끔). 만료되면 대부분의 레지스터가 기본값으로 돌아감
  watchdog_tolerance: "160 s 설정에서 실제 100–160 s (REGN LDO 꺼짐)"   # §7.6 p.11
  safety_timer_default_h: 12   # REG07[2:1]=10 기본 12시간 (5, 8, 12, 20시간 선택). 예비충전(BATLOWV 미만)은 4시간 (§8.2.7.6 p.24)
  safety_timer_half_rate: 1    # 입력 전류·전압·열 조절 중에는 타이머가 절반 속도로 감 (TMR2X_EN)
  i2c_max_scl_hz: 400000
  quiescent_bat_a: 12.0e-6     # §7.5 p.7: 입력 없이 BATFET 꺼짐 12 µA 전형 (켜짐 32 µA)
thermal:                       # §7.4 p.7
  theta_ja_c_per_w: 31.8       # RTW(WQFN-24)
  theta_jc_top_c_per_w: 27.9
  theta_jb_c_per_w: 8.7
notes:
  - 입력 전류 결정 순서: 전원을 꽂으면 불량 어댑터 판별(3.8 V, 30 mA) → REGN 켜짐(220 ms 지연) → D+/D− 판별 → IINLIM 설정 → 변환기 시작. 판별 결과는 SDP(USB500) 500 mA, CDP 1.5 A, DCP 3.25 A, 비표준 분압 어댑터 1/2/2.1/2.4 A, MaxCharge 1.5 A, 알 수 없는 어댑터 500 mA이다 (§8.2.3.3 p.16–17).
  - D+/D− 판별은 AUTO_DPDM_EN이 켜져 있어야 하고, 꺼 두면 IINLIM이 이전 값 그대로 남는다. 호스트가 IINLIM을 덮어써도 실제 입력 전류는 ILIM 핀과 레지스터 중 낮은 쪽이다 (§8.2.3.3 p.16, §8.2.12 p.26).
  - 입력 전류 최적화(ICO)가 기본 켜짐이라 DCP·MaxCharge로 판별되면 어댑터가 버티는 최대 입력 전류를 스스로 찾아 IDPM_LIM에 보고한다 (§8.2.4 p.18).
  - 시스템 기동 중 SYS가 2.2 V 미만이면 입력 전류 제한이 200 mA 이하로 강제된다 (§8.2.3.5 p.18).
  - 감시 타이머: 전원 투입 직후는 기본 모드(타이머 만료 상태)이고, I²C로 한 번이라도 쓰면 호스트 모드가 된다. 호스트가 WD_RST를 쓰지 않거나 감시 타이머를 끄지 않으면 40 s 뒤 기본 모드로 돌아가 IINLIM·VINDPM 등 일부를 뺀 레지스터가 기본값(충전 전류 2.048 A 등)으로 초기화된다 (§8.3.1 p.31).
  - 충전: 2 V 미만 100 mA, 2~3 V 예비충전, 3 V 이상 급속(정전류) 후 정전압, 종료 전류 이하이면 종료. 입력 전류·전압·열 조절 중에는 종료가 막히고 안전 타이머가 절반 속도로 간다 (§8.2.7 p.21–22).
  - 고장 시 STAT가 1 Hz로 깜빡이고 충전이 멈춘다 (입력 과전압, TS 이상, 타이머 만료 등). 고장 레지스터(REG0C)는 읽으면 지워지고 새 고장은 INT를 다시 내지 않으므로 현재 상태는 두 번 연속 읽어야 한다 (§8.2.9 p.25).
  - 부스트(OTG)는 BAT가 LOWV 이상, VBUS가 BAT+VSLEEP 미만, OTG 핀 High와 OTG_CONFIG=1, TS 온도가 범위 안, 30 ms 지연이 모두 만족돼야 시작한다. TS가 범위를 벗어나면 부스트와 BATFET이 꺼지고 BATFET_DIS가 켜진다 (§8.2.5 p.19, §8.2.7.5.2 p.23).
  - BATFET을 끄는 쉽 모드와 전체 시스템 리셋은 QON 핀(1.25–2.25 s, 12–18 s)이나 레지스터로 제어한다 (§8.2.10 p.26, §7.6 p.11).
  - 온도 프로파일은 이 부품이 차가움/뜨거움 창(Cold/Hot)이고 JEITA 프로파일은 없다 (§8.2.7.1 표 8-4 p.21).
  - 데이터시트 본문 한 곳(§8.2.3.3.1)에 'BQ25890'이라는 표기가 있다. 같은 계열 문서에서 옮겨 온 표기로 보인다.
source: "BQ25895 데이터시트 SLUSC88C Rev. C (2022-10): p.1 특징, §7.1–7.3 p.6, §7.4–7.5 p.7–10, §7.6 p.11, §8.2 p.15–31, §8.3.1 p.31, §8.4 p.32 이하"
