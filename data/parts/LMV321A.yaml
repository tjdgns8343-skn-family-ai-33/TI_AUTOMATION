# TI LMV321A 저전압 레일투레일 출력 연산증폭기 (LMV358A·LMV324A와 한 데이터시트, SBOS923I, 2024-07).
part_number: LMV321A
type: opamp
description: 1 MHz, 저전압(2.5–5.5 V) 레일투레일 출력 연산증폭기, 채널당 IQ 70 µA
abs_max:                       # §5.1 p.5
  vs_v: 6                      # 공급 전압 ([V+]−[V−]) 최대
  input_current_ma: 10         # 입력 핀 전류 ±10 mA (레일을 0.5 V 넘는 신호는 10 mA 이하로 제한)
  tj_max_c: 150
recommended:                   # §5.3 p.5
  vs_min_v: 2.5
  vs_max_v: 5.5
  ta_min_c: -40
  ta_max_c: 125
typical:                       # §5.7 p.7 (VS=5 V 부근, TA=25 °C, RL=10 kΩ)
  gbw_hz: 1.0e+6
  slew_rate_v_per_us: 1.7
  phase_margin_deg: 76         # VS=5.5 V, G=+1 (부하 용량 조건은 표에 명시되지 않음)
  vos_typ_mv: 1
  vos_max_mv: 4                # VS=5 V, 25 °C 최대. −40~125 °C에서는 최대 5 mV
  input_bias_current_pa: 10
  open_loop_gain_db: 115       # 전형 (최소 100 dB)
  vcm_low_below_rail_v: 0.1    # 동상 전압 범위: (V−)−0.1 V ~ (V+)−1 V, 위상 반전 없음
  vcm_high_below_rail_v: 1.0
  output_swing_mv_10k: 20      # 레일에서 전형 20 mV (최대 50 mV), RL=10 kΩ
  output_swing_mv_2k: 40       # 레일에서 전형 40 mV (최대 75 mV), RL=2 kΩ
  short_circuit_ma: 40
  open_loop_output_impedance_ohm: 1200   # f=1 MHz
  settling_time_us: 3          # 0.1 %까지, VS=5 V, 2 V 스텝, G=+1, CL=100 pF
  noise_density_nv_rthz: 33    # 1 kHz
  iq_a_max: 125.0e-6           # 채널당, IO=0 mA, VS=5.5 V (전형 70 µA)
thermal:                       # §5.4 p.6
  theta_ja_c_per_w: 232.8      # LMV321A DBV(SOT-23-5). DCK(SC70)는 239.6
notes:
  - 이 데이터시트는 LMV321A(1채널), LMV358A(2채널), LMV324A(4채널)를 함께 다룬다. 열저항은 채널 수·패키지마다 다르다.
  - 위상 여유 76° 값은 G=+1 조건이고 용량성 부하 값이 표에 없다. 용량성 부하를 구동할 때의 안정성은 표만으로 확인할 수 없다.
source: "LMV321A/LMV358A/LMV324A 데이터시트 SBOS923I (2024-07): §5.1 p.5, §5.3 p.5, §5.4 p.6, §5.7 p.7"
