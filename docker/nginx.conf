# 프론트엔드 컨테이너의 nginx: React 정적 파일을 주고, /api 등은 Django(backend)로 넘긴다 (같은 주소라 CORS가 필요 없다).

# 문의 접수(POST)만 분당 횟수를 제한한다: LLM 요금이 한꺼번에 나가는 것을 막는 앞단 안전장치 (토큰 일일 상한과 별개)
map $request_method $post_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $post_limit_key zone=post_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 비밀번호(basic auth): 시작할 때 docker/40-basic-auth.sh가 이 파일을 채운다 (환경변수가 없으면 빈 파일 = 꺼짐)
    include /etc/nginx/auth.conf;

    root /usr/share/nginx/html;
    index index.html;

    # 서버 상태 확인용 (비밀번호 없이)
    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/runs/ {
        limit_req zone=post_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django 관리자 화면과 그 정적 파일
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # 그 밖의 주소는 React 화면(index.html)으로
    location / {
        try_files $uri /index.html;
    }
}
